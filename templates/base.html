{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gridclaim{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=5">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-ws@2.0.2"></script>
  {% if posthog_api_key %}
  <script>
    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
    posthog.init("{{ posthog_api_key|escapejs }}", {
      api_host: "{{ posthog_host|escapejs }}",
      person_profiles: "identified_only"
    });
    {% if current_player %}
    posthog.identify("{{ current_player.id|escapejs }}", {
      display_name: "{{ current_player.display_name|escapejs }}",
      color: "{{ current_player.color|escapejs }}"
    });
    {% endif %}
  </script>
  {% endif %}
</head>
<body>
  <div
    id="app"
    class="app-shell"
    data-player-id="{{ current_player.id }}"
    data-cooldown-seconds="{{ cooldown_seconds }}"
    data-cooldown-remaining="{{ cooldown_remaining }}"
    hx-ext="ws"
    ws-connect="/ws/board/?player_id={{ current_player.id }}"
  >
    <header class="topbar">
      <div class="brand">
        <p class="brand-logo">Gridclaim</p>
        <p class="brand-sub">Shared board · live claims</p>
      </div>
      <div class="topbar-right">
        <div id="ws-status" class="pill pill-muted">Connecting…</div>
        <div id="you-chip" class="you-chip" style="--you: {{ current_player.color }}">
          <span class="swatch" aria-hidden="true"></span>
          <span class="you-name">{{ current_player.display_name }}</span>
        </div>
      </div>
    </header>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

    <div id="toast-host" class="toast-host" aria-live="polite"></div>
    {# Placeholder so claim responses can OOB-swap cooldown state into the page. #}
    <div id="cooldown-sync" hidden data-action="" data-seconds="0"></div>
  </div>
  <script src="{% static 'js/app.js' %}?v=6"></script>
</body>
</html>
